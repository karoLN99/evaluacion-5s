# Mantiene activo el proyecto gratuito de Supabase.
# Supabase pausa los proyectos gratis tras 7 días sin actividad;
# esta tarea hace una consulta pequeña cada 3 días, sin costo.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/areas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
