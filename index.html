<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluación 5´s</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300602a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3E5S%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-head" id="siteHead">
    <div class="topbar">
      <a class="brand" href="#/resumen">
        <span class="logos">
          <img src="img/tiendas-oriente.png" alt="Tiendas de Oriente">
          <img src="img/cedis-oriente.png" alt="Centro de Distribución de Oriente" class="l-cedis">
          <img src="img/oasis.png" alt="Oasis Supermercados">
          <img src="img/quali.png" alt="Tiendas Quali">
        </span>
        <span class="brand-text">
          <strong id="titulo">Evaluación 5´s</strong>
          <small id="subtitulo">Centro de Distribución de Oriente</small>
        </span>
      </a>
      <div class="topbar-right">
        <span class="semana-actual" id="semanaActual"></span>
        <a class="btn btn-primary" href="#/nueva" id="btnNueva">+ Nueva evaluación</a>
      </div>
    </div>
    <div class="franja" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </header>

  <div id="demoBanner" class="demo-banner" hidden>
    Modo demo: se muestran los datos del Excel y lo que guardes se pierde al recargar. Configura Supabase en <code>config.js</code> para guardar de verdad.
  </div>

  <div class="layout">
    <nav class="sidebar" aria-label="Áreas">
      <a class="nav-item nav-resumen" href="#/resumen">Resumen general</a>
      <div class="nav-label">Áreas</div>
      <div id="navAreas"></div>
    </nav>
    <div class="mobile-nav">
      <select id="mobileNav" aria-label="Ir a"></select>
    </div>
    <main id="main" tabindex="-1">
      <div class="loading">Cargando datos…</div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
